<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#17324d;color:#fff}.w{max-width:430px;margin:auto;padding:12px}
.card{background:#254b70;border-radius:12px;padding:12px;margin:10px 0}.teams{display:flex;justify-content:space-between;text-align:center}.score{font-size:44px;font-weight:bold}.poss{color:#ffd54f}.field{position:relative;height:36px;background:#2e7d32;border-radius:8px}.line{position:absolute;top:0;bottom:0;width:2px;background:#fff7;}.ball{position:absolute;top:8px;font-size:20px;transform:translateX(-50%)}button{width:100%;padding:16px;margin:6px 0;font-size:22px;border:0;border-radius:10px}.row{display:flex;gap:8px}.row button{flex:1}#modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}#box{background:#fff;color:#000;padding:16px;border-radius:12px;width:300px}#disp{font-size:34px;text-align:right;border:1px solid #999;padding:6px;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid button{padding:14px;font-size:22px}
</style></head><body><div class=w>
<div class=card><div id=half>1st Half</div>
<div class=teams><div><div id=hp class=poss>🏈</div>HOME<div id=hs class=score>0</div></div><div><div id=ap>&nbsp;</div>AWAY<div id=as class=score>0</div></div></div>
<div class=field><div class=line style="left:0%"></div><div class=line style="left:25%"></div><div class=line style="left:50%"></div><div class=line style="left:75%"></div><div class=line style="left:100%"></div><div id=ball class=ball>🏈</div></div>
<div id=info style="text-align:center;font-size:28px;margin-top:8px"></div></div>
<div class=row><button onclick="openPad('gain')">Gain</button><button onclick="openPad('loss')">Loss</button></div>
<div class=row><button onclick="touchdown()">TD</button><button onclick="turnover()">Turnover</button></div>
<div class=row><button onclick="undo()">Undo</button><button onclick="toggleHalf()">Half</button></div>
<div class=card id=log></div></div>
<div id=modal><div id=box><div id=title></div><div id=disp>0</div><div class=grid id=keys></div><button onclick="ok()">OK</button><button onclick="modal.style.display='none'">Cancel</button></div></div>
<script>
let s={half:1,pos:'HOME',hs:0,as:0,ball:40,down:1,marker:20,log:[],hist:[]},mode='',val='';
function save(){s.hist.push(JSON.stringify({...s,hist:[]}))}
function render(){half.textContent=(s.half==1?'1st':'2nd')+' Half';hs.textContent=s.hs;as.textContent=s.as;hp.textContent=s.pos=='HOME'?'🏈':'';ap.textContent=s.pos=='AWAY'?'🏈':'';info.textContent=`Ball ${s.ball}   ${s.down} & ${Math.max(s.ball-s.marker,0)}`;ball.style.left=(100-s.ball*2.5)+'%';log.innerHTML=s.log.slice().reverse().map(x=>'• '+x).join('<br>')}
function openPad(m){mode=m;val='';disp.textContent='';title.textContent=m=='gain'?'Gain Yards':'Loss Yards';keys.innerHTML='';['1','2','3','4','5','6','7','8','9','0','⌫'].forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{if(k=='⌫')val=val.slice(0,-1);else val+=k;disp.textContent=val||0};keys.appendChild(b)});modal.style.display='flex'}
function ok(){let y=parseInt(val);if(isNaN(y))return;modal.style.display='none';save();s.ball+=mode=='gain'?-y:y;s.ball=Math.max(0,Math.min(40,s.ball));s.down++;s.log.push(`${s.pos} ${mode} ${y}`);if(s.ball<=s.marker&&s.ball>0){s.down=1;s.marker=Math.max(s.ball-20,0);s.log.push('First Down')}render()}
function touchdown(){save();if(s.pos=='HOME')s.hs+=6;else s.as+=6;let x=prompt('XP 0/1/2','1');x=parseInt(x)||0;if(s.pos=='HOME')s.hs+=x;else s.as+=x;turnover(false)}
function turnover(sv=true){if(sv)save();s.pos=s.pos=='HOME'?'AWAY':'HOME';s.ball=40;s.down=1;s.marker=20;s.log.push('Turnover');render()}
function undo(){if(!s.hist.length)return;let p=JSON.parse(s.hist.pop());p.hist=s.hist;s=p;render()}
function toggleHalf(){s.half=s.half==1?2:1;render()}render();
</script></body></html>
